# SNI mux on :443. Default upstream is the maska/reality inbound on 127.0.0.1:10443.
# Domain sites are served by nginx on 127.0.0.1:8447 (AI) and :8448 (monitoring).
stream {
    map $ssl_preread_server_name $paperclip_upstream {
        __DOMAIN_AI__         127.0.0.1:8447;
        __DOMAIN_MONITORING__ 127.0.0.1:8448;
        default        127.0.0.1:10443;
    }
    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $paperclip_upstream;
        ssl_preread on;
        proxy_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}
