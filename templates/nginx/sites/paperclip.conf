server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_AI__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://__DOMAIN_AI__$request_uri;
    }
}

server {
    listen 127.0.0.1:8447 ssl;
    server_name __DOMAIN_AI__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN_AI__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_AI__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
