server {
    listen 2096 ssl;
    listen [::]:2096 ssl;
    server_name _;

    ssl_certificate /root/cert/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key /root/cert/__SERVER_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_verify off;

    # Optional: clients that get Happ/Incy whitelist routing headers.
    # If __SUB_PATHS_REGEX__ is empty, this location is omitted by install.sh.
    location ~ ^/sub/(__SUB_PATHS_REGEX__)/?$ {
        include /etc/nginx/snippets/roscom-whitelist.conf;
        proxy_pass http://127.0.0.1:2098;
    }

    location /routing/ {
        alias /var/www/roscom/;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:2098;
    }
}
