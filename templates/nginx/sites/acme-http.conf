# HTTP only — used until domain vhosts exist, and always serves ACME webroot.
# Keep this (or equivalent location) so IP and domain certs can use webroot
# without stopping nginx / binding acme.sh to port 80 (standalone breaks Paperclip).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 204;
    }
}
