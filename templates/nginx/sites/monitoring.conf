server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_MONITORING__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://__DOMAIN_MONITORING__$request_uri;
    }
}

server {
    listen 127.0.0.1:8448 ssl;
    server_name __DOMAIN_MONITORING__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN_MONITORING__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_MONITORING__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
