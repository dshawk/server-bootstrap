# Multilogin SOCKS5 proxy — auth required, no open relay
logoutput: syslog
internal: 0.0.0.0 port = __DANTE_PORT__
external: __EXTERNAL_IFACE__
socksmethod: username
clientmethod: none
user.privileged: root
user.unprivileged: nobody
user.libwrap: nobody

client pass {
        from: 0.0.0.0/0 to: 0.0.0.0/0
        log: error connect disconnect
}

socks pass {
        from: 0.0.0.0/0 to: 0.0.0.0/0
        socksmethod: username
        protocol: tcp udp
        log: error connect disconnect
}
