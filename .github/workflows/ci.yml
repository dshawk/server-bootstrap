name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: shell and templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and PyYAML
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck python3-yaml

      - name: bash -n
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' | sort)
          # warning includes error. Style/info is ignored; the SC2016 note in
          # install.sh is an intentional single-quoted PATH assignment.
          shellcheck -S warning "${files[@]}"

      - name: Validate JSON and YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          import yaml

          root = pathlib.Path(".")
          json_files = []
          yaml_files = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix == ".json":
                  json_files.append(path)
              elif path.suffix in {".yml", ".yaml"}:
                  yaml_files.append(path)
          if not json_files and not yaml_files:
              sys.exit("no JSON or YAML files found")
          for path in sorted(json_files):
              json.loads(path.read_text())
              print(f"json ok {path}")
          for path in sorted(yaml_files):
              list(yaml.safe_load_all(path.read_text()))
              print(f"yaml ok {path}")
          PY
