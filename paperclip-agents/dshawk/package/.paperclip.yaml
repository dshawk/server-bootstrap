      characterVersion: "cap-v1"
      paletteId: "tangerine-cobalt"
      schemaVersion: 1
    inputs:
      env:
        ALL_PROXY:
          description: "Optional default for ALL_PROXY on agent agent-2"
          kind: "plain"
          default: "socks5h://127.0.0.1:40000"
          requirement: "optional"
        GEMINI_API_KEY:
          description: "Optional default for GEMINI_API_KEY on agent agent-2"
          kind: "secret"
          default: ""
          requirement: "optional"
        GEMINI_MODEL:
          description: "Optional default for GEMINI_MODEL on agent agent-2"
          kind: "plain"
          default: "gemini-2.5-flash-lite"
          requirement: "optional"
        HTTP_PROXY:
          description: "Optional default for HTTP_PROXY on agent agent-2"
          kind: "plain"
          default: "http://127.0.0.1:40000"
          requirement: "optional"
        HTTPS_PROXY:
          description: "Optional default for HTTPS_PROXY on agent agent-2"
          kind: "plain"
          default: "http://127.0.0.1:40000"
          requirement: "optional"
        NO_PROXY:
